[project]
name = "hark"
version = "0.1.0"
description = "Live captions that run on the device and learn a speaker's words from their corrections."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "onnxruntime==1.29.0", "soundfile>=0.12", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "sherpa-onnx>=1.10", "kaldi-native-fbank>=1.20"]

[project.scripts]
hark = "hark.cli:main"

[tool.setuptools]
packages = ["hark"]
[tool.setuptools.package-data]
hark = ["common_words.json"]
